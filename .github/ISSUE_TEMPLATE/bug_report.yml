name: Bug report
description: Report a reproducible HookGuard defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What failed and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic payloads; never include secrets or customer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HookGuard version or commit
      description: For development builds, include the commit hash if available.
  - type: input
    id: environment
    attributes:
      label: Operating system, Node.js, and pnpm versions
      placeholder: Windows 11, Node.js 26, pnpm 11.25.0
  - type: textarea
    id: scenario
    attributes:
      label: Minimal synthetic scenario or command
      description: Include only the inputs needed to reproduce the defect, with secrets and customer data removed.
  - type: textarea
    id: evidence
    attributes:
      label: Logs and test evidence
      description: Redact sensitive details.
