name: Bug report
description: Report a reproducible HookGuard defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What failed and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic payloads; never include secrets or customer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HookGuard version or commit
      description: If no version exists, say "unreleased".
  - type: textarea
    id: evidence
    attributes:
      label: Logs and test evidence
      description: Redact sensitive details.
